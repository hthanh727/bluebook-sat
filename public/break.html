<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Time - Bluebook</title>
    <style>
        :root {
            --bg: #111827;
            --text: #f8fafc;
            --blue: #3b82f6;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { margin-top: 0; font-size: 32px; font-weight: 600; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.5; margin-bottom: 30px; }
        .timer {
            font-size: 72px;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            color: #fff;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .btn {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Break Time</h1>
        <p>You have completed the Reading and Writing section. You have 10 minutes before the Math section begins. Please do not close this window.</p>
        
        <div class="timer" id="timer">10:00</div>
        
        <button class="btn" id="resumeBtn">Resume Testing Now</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nextUrl = urlParams.get('next') || '/dashboard';
        
        let timeLeft = 600; // 10 minutes
        const timerEl = document.getElementById('timer');
        
        const interval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(interval);
                window.location.href = nextUrl;
                return;
            }
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }, 1000);

        document.getElementById('resumeBtn').addEventListener('click', () => {
            window.location.href = nextUrl;
        });
    </script>
</body>
</html>
